# Зависимости быстрого набора (PEP 735): `pip install --group test`, pip ≥ 25.1.
# numpy — тесты службы F5 (tts-f5), starlette — разбор её формы,
# cryptography — Web Push комнаты; тяжёлое (torch, f5_tts, fastapi, ruaccent)
# тесты подменяют заглушками и здесь не нужно.
[dependency-groups]
test = ["pytest", "pytest-timeout", "numpy", "starlette", "cryptography"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: ходит на шару/SSH/в живые службы или дольше ~1с",
    "manual: запускается руками",
]
addopts = "-v --tb=short -m 'not integration and not manual'"
# pytest-timeout: зависший тест падает за 30 с со стеком, а не держит прогон
timeout = 30
